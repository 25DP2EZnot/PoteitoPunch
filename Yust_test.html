<script>
    const title = document.getElementById("myId")
    const btn = document.getElementById("btn")
    const patato = document.getElementById("patato")


    // function myFunction() {
    //     title.innerHTML = "Paskaidrojums"
    //     title.style.color = "red"
    // }+

    // btn.addEventListener("click", myFunction) 

    let score = 0
    let bonus = 1
    let patatonatorCost = 100
    patato.innerHTML = "Ubgrade: " + patatonatorCost


    patato.addEventListener("click", () => {
        if (score >= patatonatorCost) {
            bonus += 1
            score -= patatonatorCost
            title.innerHTML = score
            patatonatorCost *= 2
            patato.innerHTML = "Ubgrade: " + patatonatorCost
        }
        else {
            alert("Noght enought potato, man... :(")
        }
    })

    btn.addEventListener("click", () => {
        score += bonus
        title.innerHTML = score
        title.style.color = "red"     
    })

    console.log(title.innerHTML)
    if (title.innerHTML === "Virsraksts") {
        console.log("Title ir Virsraksts")
    }

</script>
