<!DOCTYPE html>
<html>
<head>
    <title>PotatoPunch</title>
    <style>
        body{
            margin:0;
            margin-inline: 25%;
            height:100vh;
            background-image:url("IMG/pot_back.png");
            background-size:200px;
            background-repeat:repeat;
            position: absolute;
        }
        #KikMe, h1, button, #parti{
            width: 900px;
            height: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px;
            font-size: 40px;
        }
        #parti{
            width: 200px;
            margin-top: -460px;
            margin-left: 75%;
            position: absolute;
            z-index: -1;
        }
        .hidden {
            display: none;
        }
        div {
            display: flex;

        }
        .Trof {
            width: 300px;
            height: auto;
            margin: 0px;
            font-size: 40px;
        }
    </style>
</head>
<body>

    <button id="Puched">Puch me! If you dear tupid uman</button>

    <img id="KikMe" src="IMG\pot_kiknt.png">

    <img id="parti" src="IMG\poteit.png">

    <button id="AAA" class="step-btn">Slieka 1</button>
    <button id="BBB" class="step-btn hidden">Mājas ceptie kartupeļi 10</button>
    <button id="CCC" class="step-btn hidden">Kartupeļu ciete 100</button>
    <button id="DDD" class="step-btn hidden">Pateito DNS 2000</button>
    <button id="EEE" class="step-btn hidden">Prengles 500000</button>
    <button id="FFF" class="step-btn hidden">Ne Njutona šķidrums 10000000</button>
    <button id="GGG" class="step-btn hidden">Kartupeļu ādas somiņa 200000000000</button>
    <button id="HHH" class="step-btn hidden">Pateitinator Power 50000000000000</button>
    <button id="III" class="step-btn hidden">King Teider 100000000000000000</button>
    <button id="JJJ" class="step-btn hidden">God Buļba 2000000000000000000000000000</button>

    <button id="bigkik" class="step-btn hidden">
        <img src="IMG\Pipe.png">
        Pipe to kill stupit potat: 10^100
    </button>
    
    <div>
        <img id="trf1" class="Trof" src="IMG\trfnt.png">
        <img id="trf67" class="Trof" src="IMG\trfnt.png">
        <img id="trf69" class="Trof" src="IMG\trfnt.png"> 
    </div>
    <div>
        <img id="trf420" class="Trof" src="IMG\trfnt.png">
        <img id="trf2008" class="Trof" src="IMG\trfnt.png">
        <img id="trfwin" class="Trof" src="IMG\trfnt.png">
    </div>

    <audio id="Snd" src="SND\Pot_punch.mp3"></audio>
    <audio id="Snd2" src="SND\Pot_upgrade.mp3"></audio>
    <audio id="Snd3" src="SND\Pot_bonk.mp3"></audio>
    <audio id="Snd4" src="SND\kongratuationes.mp3"></audio>
    <audio id="Snd5" src="SND\BIG_Win_SUNDE.mp3"></audio>
    <audio id="Snd6" src="SND\last jingle.mp3"></audio>

</body>
<script>
    const Puched = document.getElementById("Puched")
    const KikMe = document.getElementById("KikMe")

    const AAA = document.getElementById("AAA")
    const BBB = document.getElementById("BBB")
    const CCC = document.getElementById("CCC")
    const DDD = document.getElementById("DDD")
    const EEE = document.getElementById("EEE")
    const FFF = document.getElementById("FFF")
    const GGG = document.getElementById("GGG")
    const HHH = document.getElementById("HHH")
    const III = document.getElementById("III")
    const JJJ = document.getElementById("JJJ")

    const Snd = document.getElementById("Snd")
    const Snd2 = document.getElementById("Snd2")
    const Snd3 = document.getElementById("Snd3")
    const Snd4 = document.getElementById("Snd4")
    const Snd5 = document.getElementById("Snd5")
    const Snd6 = document.getElementById("Snd6")
    
    const bigkik = document.getElementById("bigkik")

    const TOF1 = document.getElementById("trf1")
    const TOF2 = document.getElementById("trf67")
    const TOF3 = document.getElementById("trf69")
    const TOF4 = document.getElementById("trf420")
    const TOF5 = document.getElementById("trf2008")
    const TOF6 = document.getElementById("trfwin")

    let toded = 10**100
    let score = 0
    let bonus = 1

    let kmA = 1
    let kmB = 10**1
    let kmC = 10**2
    let kmD = 2 * 10**3
    let kmE = 5 * 10**5
    let kmF = 10**7
    let kmG = 2 * 10**11
    let kmH = 5 * 10**13
    let kmI = 10**17
    let kmJ = 2 * 10**27

    let AAAA = 0
    let BBBB = 0
    let CCCC = 0
    let DDDD = 0
    let EEEE = 0
    let FFFF = 0
    let GGGG = 0
    let HHHH = 0
    let IIII = 0
    let JJJJ = 0

    let MORA = 0
    let isWon = false
    let intervalStarted = false


    //particle

    const img = document.getElementById("parti")

    let scale = 1;
    let margin = 705;

    const startScale = 1;
    const startMargin = 705;

    function step() {
    if (scale > 0) {
        scale -= 0.01;
        margin += 5;

        img.style.transform = `scale(${scale})`;
        img.style.marginLeft = `${margin}px`;

        setTimeout(step, 10);
    } else {
        scale = startScale;
        margin = startMargin;

        img.style.transform = `scale(${scale})`;
        img.style.marginLeft = `${margin}px`;

    }
    };

    //trofs

    function monitorScore1() {
        if (score > 0 && !TOF1.src.includes("IMG/trf1.png")) {
            TOF1.src = "IMG/trf1.png";
            Snd4.currentTime = 0;
            Snd4.play();
            alert("Tu nospiedi 1 kliku");
        }
    }
    function monitorScore2() {
        if (score > 66 && !TOF2.src.includes("IMG/trf67.png")) {
            TOF2.src = "IMG/trf67.png"
            Snd4.currentTime = 0;
            Snd4.play();
            alert("hahaha hahahaha 6 un 7 aaaaaaaaa")
        }
    }
    function monitorScore3() {
        if (score > 68 && !TOF3.src.includes("IMG/trf69.png")) {
            TOF3.src = "IMG/trf69.png"
            Snd4.currentTime = 0;
            Snd4.play();
            alert("Nice")
        }
     }
    function monitorScore4() {
        if (score > 419 && !TOF4.src.includes("IMG/trf420.png")) {
            TOF4.src = "IMG/trf420.png"
            Snd4.currentTime = 0;
            Snd4.play();
            alert("Tu jau zini ka tikas kartupaļi sit citādāk...")
        }
     }
    function monitorScore5() {
        if (score > 2007 && !TOF5.src.includes("IMG/trf2008.png")) {
            TOF5.src = "IMG/trf2008.png"
            Snd4.currentTime = 0;
            Snd4.play();
            alert("Tu nospiedi tik daudz klikus kurā gadā kartupaļi bija vis populārākais dārzenis!")
        }
     }
    function monitorScore6() {
        if (isWon === true && !TOF6.src.includes("IMG/trfwin.png")) {
            TOF6.src = "IMG/trfwin.png"
            Snd5.currentTime = 0;
            Snd5.play();
            alert("Tu nospiedi un nositi patatu")
            Snd6.currentTime = 0;
            Snd6.play();
        }
     }
    
    //Poteito klik

    KikMe.addEventListener("click", () => {
        score += bonus;
        Puched.innerHTML = Math.floor(score);
        monitorScore1()
        monitorScore2()
        monitorScore3()
        monitorScore4()
        monitorScore5()
        monitorScore6()
        step()
    });

    KikMe.addEventListener("click", () => {
        if (!isWon) {
            Snd.currentTime = 0;
            Snd.play();
            KikMe.src = "IMG/pot_kik.png";
            setTimeout(() => {
                if (!isWon) KikMe.src = "IMG/pot_kiknt.png";
            }, 600);
        } else {
            Snd.currentTime = 0;
            Snd.play();
        }
    });

    //Upgrade

    AAA.addEventListener("click", () => {
        if (!intervalStarted) {
            intervalStarted = true;

            setInterval(function () {
                score += AAAA/10 + MORA;
                Puched.innerHTML = Math.floor(score);
            }, 1000);
        }
    });

    AAA.addEventListener("click", () => {
        if (score >= kmA) {
            bonus += 1;
            score -= kmA;
            kmA *= 1.15**AAAA;
            AAAA += 1;
            AAA.innerHTML = "Tev ir " + AAAA + " Slieku, un vēl vienu var nopirkt par " + Math.floor(kmA);
            Puched.innerHTML = Math.floor(score);
            Snd2.pause();
            Snd2.currentTime = 0;
            Snd2.play();
        }
        else {
            alert("Noght enought potato, slieka nerespektē tevi... :(");
        }
    });

    BBB.addEventListener("click", () => {
        if (score >= kmB) {
            bonus += 10;
            score -= kmB;
            kmB *= 1.15**BBBB;
            BBBB += 1;
            MORA += 5
            BBB.innerHTML = "Tev ir " + BBBB + " Mājas cepti kartupeļi, un vēl vienu var nopirkt par " + Math.floor(kmB);
            Puched.innerHTML = Math.floor(score);
            Snd2.pause();
            Snd2.currentTime = 0;
            Snd2.play();
        }
        else {
            alert("Noght enought potato, karturļi sanāk pārāk sausi un eļļaini... :(");
        }
    });

    CCC.addEventListener("click", () => {
        if (score >= kmC) {
            bonus += 100;
            score -= kmC;
            kmC *= 1.15**CCCC;
            CCCC += 1;
            MORA += 10
            CCC.innerHTML = "Tev ir " + CCCC + " Kartupeļu cites paciņas, un vēl vienu var nopirkt par " + Math.floor(kmC);
            Puched.innerHTML = Math.floor(score);
            Snd2.pause();
            Snd2.currentTime = 0;
            Snd2.play();
        }
        else {
            alert("Noght enought potato, tas bija cits balts pulveris kas liek aizdomāties... :(");
        }
    });

    DDD.addEventListener("click", () => {
        if (score >= kmD) {
            bonus += 1000;
            score -= kmD;
            kmD *= 1.15**DDDD;
            DDDD += 1;
            MORA += 20
            DDD.innerHTML = "Tev ir " + DDDD + " Pateito DNSsu, un vēl vienu var nopirkt par " + Math.floor(kmD);
            Puched.innerHTML = Math.floor(score);
            Snd2.pause();
            Snd2.currentTime = 0;
            Snd2.play();
        }
        else {
            alert("Noght enought potato, kaut kas mutēja, evolucionēja, un saprata ka bija labāk kad mēs bijām zivis... :(");
        }
    });

    EEE.addEventListener("click", () => {
        if (score >= kmE) {
            bonus += 10000;
            score -= kmE;
            kmE *= 1.15**EEEE;
            EEEE += 1;
            MORA += 50
            EEE.innerHTML = "Tev ir " + EEEE + " Pateito Prenglsu, un vēl vienu var nopirkt par " + Math.floor(kmE);
            Puched.innerHTML = Math.floor(score);
            Snd2.pause();
            Snd2.currentTime = 0;
            Snd2.play();
        } else {
            alert("Noght enought potato, tubas čipši uzbruka un nozaga tavu maku... :(");
        }
    });

    FFF.addEventListener("click", () => {
        if (score >= kmF) {
            bonus += 100000;
            score -= kmF;
            kmF *= 1.15**FFFF;
            FFFF += 1;
            MORA += 100
            FFF.innerHTML = "Tev ir " + FFFF + " Ne Njutonu šķidrumu, un vēl vienu var nopirkt par " + Math.floor(kmF);
            Puched.innerHTML = Math.floor(score);
            Snd2.pause();
            Snd2.currentTime = 0;
            Snd2.play();
        } else {
            alert("Noght enought potato, Ne Njutons atsita galvu un nogrima šajā šķidrumā... :(");
        }
    });

    GGG.addEventListener("click", () => {
        if (score >= kmG) {
            bonus += 1000000;
            score -= kmG;
            kmG *= 1.15**GGGG;
            GGGG += 1;
            MORA += 200
            GGG.innerHTML = "Tev ir " + GGGG + " Kartupeļu ādas somiņu, un vēl vienu var nopirkt par " + Math.floor(kmG);
            Puched.innerHTML = Math.floor(score);
            Snd2.pause();
            Snd2.currentTime = 0;
            Snd2.play();
        } else {
            alert("Noght enought potato, Mode pagāja tevi garām... :(");
        }
    });

    HHH.addEventListener("click", () => {
        if (score >= kmH) {
            bonus += 10000000;
            score -= kmH;
            kmH *= 1.15**HHHH;
            HHHH += 1;
            MORA += 500
            HHH.innerHTML = "Tev ir " + HHHH + " Poteitoneitor Powers, un vēl vienu var nopirkt par " + Math.floor(kmH);
            Puched.innerHTML = Math.floor(score);
            Snd2.pause();
            Snd2.currentTime = 0;
            Snd2.play();
        } else {
            alert("Noght enought potato, Ne Dufenšmercs ne Ostins nevēlas ar tevi strādāt.... :(");
        }
    });

    III.addEventListener("click", () => {
        if (score >= kmI) {
            bonus += 100000000;
            score -= kmI;
            kmI *= 1.15**IIII;
            IIII += 1;
            MORA += 1000
            III.innerHTML = "Tev ir " + IIII + " Kingu Teideru, un vēl vienu var nopirkt par " + Math.floor(kmI);
            Puched.innerHTML = Math.floor(score);
            Snd2.pause();
            Snd2.currentTime = 0;
            Snd2.play();
        } else {
            alert("Noght enought potato, Karalis Teiders rojāli aizsūta jūs uz publisku eksekjūciju... :(");
        }
    });

    JJJ.addEventListener("click", () => {
        if (score >= kmJ) {
            bonus += 1000000000;
            score -= kmJ;
            kmJ *= 1.15**JJJJ;
            JJJJ += 1;
            MORA += 20000
            JJJ.innerHTML = "Tev ir " + JJJJ + " God Buļbu, un vēl vienu var nopirkt par " + Math.floor(kmJ);
            Puched.innerHTML = Math.floor(score);
            Snd2.pause();
            Snd2.currentTime = 0;
            Snd2.play();
        } else {
            alert("Noght enought potato, Tu nēsi derīgs cienīšanai bērns... :(");
        }
    });

    //Evil cheat

    document.addEventListener('keydown', function(event) {
        if (event.key === 'a' || event.key === 'A') {
            score += 10**100
            Puched.innerHTML = score

        }
    });

    //Endgame
    
    bigkik.addEventListener("click", () => {
        if (score >= toded) {
            Snd3.currentTime = 0;
            Snd3.play();            
            KikMe.src = "IMG/pot_kikkest.png"
            AAA.innerHTML = "Tu uzvarēji! Tu vērti mani par chipsi, tu uzvarēji, es atvainojos!"
            score = 0
            isWon = true
        }
        else {
            alert("Noght enought potato, man... get graindin, em uman! ;p")
        }
    })

    //BUTNE REVELE

    document.addEventListener("DOMContentLoaded", () => {
      const buttons = Array.from(document.querySelectorAll(".step-btn"));
      let revealedCount = 1;

      buttons.forEach((btn, index) => {
        btn.addEventListener("click", () => {
          const nextIndex = index + 1;
          if (nextIndex < buttons.length && nextIndex === revealedCount) {
            buttons[nextIndex].classList.remove("hidden");
            revealedCount++;
          }
        });
      });
    });

</script>
</html>
