    //particle

const img = document.getElementById("parti");

function createParticle() {

    const klons = img.cloneNode(true);
    img.parentNode.appendChild(klons);

    let angle = Math.random() * Math.PI * 2;
    let x = Math.cos(angle);
    let y = Math.sin(angle);

    let scale = 1.3;
    let marginT = -1200;
    let marginL = 400;
    let rotate = 0;

    function step() {

        if (scale > 0) {

            scale -= 0.01;
            marginT += y * 10;
            marginL += x * 10;
            rotate += Math.random() * 10;

            klons.style.marginLeft = `${marginL}px`;
            klons.style.marginTop = `${marginT}px`;
            klons.style.transform =
                `scale(${scale}) rotate(${rotate}deg)`;

            setTimeout(step, 10);

        } else {

            klons.remove();

        }
    }

    step();
}
